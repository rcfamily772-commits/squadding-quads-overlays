name: Publish SQWall v1.5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wallpaper-shuffle/v1.5/build.py'
      - 'wallpaper-shuffle/v1.5/main.lua'
      - '.github/workflows/sqwall-v1.5.yml'
permissions:
  contents: write
concurrency:
  group: sqwall-v1.5-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original 32-image release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/sqwall-source
          gh release download SQwall --pattern SQWall-v1.1.zip --dir /tmp/sqwall-source --repo "$GITHUB_REPOSITORY"
      - name: Build and verify each radio package
        run: python3 wallpaper-shuffle/v1.5/build.py /tmp/sqwall-source/SQWall-v1.1.zip wallpaper-shuffle/v1.5/main.lua /tmp/sqwall-release
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view SQwall-v1.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload SQwall-v1.5 /tmp/sqwall-release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create SQwall-v1.5 /tmp/sqwall-release/* --target "$GITHUB_SHA" --title "SQ Wallpaper Shuffle v1.5 — Complete Gallery" --notes-file wallpaper-shuffle/v1.5/RELEASE-NOTES.md --repo "$GITHUB_REPOSITORY"
          fi
