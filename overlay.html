<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stream Overlay Preview</title><style>
:root{--fg:#f5f7fb;--muted:#d5dfeb;--accent:#bfe6ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--fg);font:16px system-ui,Segoe UI,sans-serif}.widget{position:absolute;background:linear-gradient(145deg,rgba(255,255,255,.115),rgba(195,220,255,.045) 42%,rgba(20,32,50,.13));border:1px solid rgba(255,255,255,.24);border-top-color:rgba(255,255,255,.38);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 10px 35px rgba(0,0,0,.12);-webkit-backdrop-filter:blur(20px) saturate(145%);backdrop-filter:blur(20px) saturate(145%);padding:16px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:700}.sub{top:4%;right:3%;min-width:240px}.number{font-size:38px;font-weight:750;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.chat{bottom:5%;left:3%;width:390px;height:310px;display:flex;flex-direction:column}.messages{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden;flex:1;padding-top:12px}.msg{animation:appear .35s ease both;font-size:14px;line-height:1.4;overflow-wrap:anywhere}.who{font-weight:700;color:var(--accent);margin-right:7px}.support{right:3%;top:24%;width:220px;height:235px;overflow:hidden}.viewport{height:165px;overflow:hidden;mask-image:linear-gradient(transparent,#000 14%,#000 85%,transparent)}.credits{display:flex;flex-direction:column;gap:12px;animation:roll 24s linear infinite;padding-top:165px}.person{font-size:13px;font-weight:600}.tier{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-100%)}}body[data-widget="subscribers"] .chat,body[data-widget="subscribers"] .support,body[data-widget="chat"] .sub,body[data-widget="chat"] .support,body[data-widget="supporters"] .sub,body[data-widget="supporters"] .chat{display:none}body[data-widget]:not([data-widget="all"]) .widget{top:12px;left:12px;right:auto;bottom:auto}body[data-widget="chat"] .chat{width:calc(100% - 24px);height:calc(100% - 24px)}body[data-widget="supporters"] .support{width:calc(100% - 24px);height:calc(100% - 24px)}body[data-widget="supporters"] .viewport{height:calc(100% - 40px)}body[data-widget="subscribers"] .sub{width:calc(100% - 24px)}
.widget { text-shadow: 0 2px 4px rgba(0,0,0,.92), 0 0 10px rgba(0,0,0,.65); }.number { text-shadow: 0 2px 5px rgba(0,0,0,.98), 0 0 14px rgba(0,0,0,.8); -webkit-text-stroke: .25px rgba(0,0,0,.35); }.who, .person { text-shadow: 0 2px 4px rgba(0,0,0,.98), 0 0 8px rgba(0,0,0,.8); }.eyebrow, .tier { text-shadow: 0 1px 3px rgba(0,0,0,1), 0 0 7px rgba(0,0,0,.85); }
</style></head><body data-widget="all"><section class="widget sub"><div class="eyebrow">YouTube subscribers</div><div class="number" id="subs">—</div></section><section class="widget chat"><div class="eyebrow">Live chat</div><div class="messages" id="messages"></div></section><section class="widget support"><div class="eyebrow">Our supporters ♥</div><div class="viewport"><div class="credits" id="credits"></div></div></section><script>
const params=new URLSearchParams(location.search),widget=params.get('widget')||'all';document.body.dataset.widget=widget;let count=12450;const names=['Alex','Taylor','Morgan','Sam','Charlie','Jordan','Casey','Jamie','Riley','Robin'];const texts=['Loving the stream!','That was brilliant 😂','Hello everyone!','Great to be here','Nice setup!','Let’s go!','Awesome work','How’s it going?'];const supporters=params.get('demo')==='1'?[['Avery K.','Patreon'],['Jordan M.','YouTube member'],['Sam R.','Patreon'],['Taylor B.','YouTube member'],['Charlie P.','Patreon'],['Morgan D.','YouTube member'],['Jamie S.','Patreon'],['Riley T.','YouTube member']]:[];function addMessage(name,text){const el=document.createElement('div');el.className='msg';const who=document.createElement('span');who.className='who';who.textContent=name+':';el.append(who,document.createTextNode(text));document.getElementById('messages').append(el);while(document.getElementById('messages').children.length>8)document.getElementById('messages').firstChild.remove()}function renderCredits(){const root=document.getElementById('credits');root.replaceChildren();if(!supporters.length){const empty=document.createElement('div');empty.className='person';empty.textContent='Supporter acknowledgements coming soon';root.append(empty);return;}supporters.forEach(([name,tier])=>{const row=document.createElement('div');row.innerHTML='<div class="person"></div><div class="tier"></div>';row.children[0].textContent=name;row.children[1].textContent=tier;root.append(row)});root.style.animationDuration=Math.max(18,supporters.length*3)+'s'}function addSubscriber(){count++;document.getElementById('subs').textContent=count.toLocaleString('en-GB')}function simulateChat(){addMessage(names[Math.random()*names.length|0],texts[Math.random()*texts.length|0])}window.overlayDemo={addSubscriber,simulateChat,addMessage,replaceSupporters:(items)=>{supporters.splice(0,supporters.length,...items);renderCredits()}};const SUBSCRIBER_API=null; // Configure your own Cloudflare Worker before enabling live datalet liveSubscribers=false;async function refreshSubscribers(){try{if(!SUBSCRIBER_API)throw new Error("Subscriber API not configured");const response=await fetch(SUBSCRIBER_API,{cache:"no-store"});if(!response.ok)throw new Error("API "+response.status);const data=await response.json();if(typeof data.subscribers!=="number"||!Number.isFinite(data.subscribers))throw new Error("No public count");count=data.subscribers;liveSubscribers=true;document.getElementById('subs').textContent=count.toLocaleString('en-GB')}catch(error){console.warn("Subscriber update failed:",error);if(!liveSubscribers)document.getElementById('subs').textContent="—"}}refreshSubscribers();setInterval(refreshSubscribers,300000);renderCredits();
const CHAT_API=null; // Configure your own Cloudflare Worker before enabling live data
const chatRoot=document.getElementById("messages");
let chatTimer=null;
let lastChatStatus="";
function chatNotice(message){
  chatRoot.replaceChildren();
  const item=document.createElement("div");
  item.className="msg";
  item.textContent=message;
  chatRoot.append(item);
}
async function refreshChat(){
  let delay=60000;
  try{
    if(!CHAT_API)throw new Error("Chat API not configured");const response=await fetch(CHAT_API,{cache:"no-store"});
    if(!response.ok)throw new Error("Chat API "+response.status);
    const data=await response.json();
    if(data.status==="live"){
      const messages=Array.isArray(data.messages)?data.messages:[];
      const signature=messages.map(m=>m.id||m.publishedAt||m.text).join("|");
      if(!messages.length){
        if(lastChatStatus!=="live-empty")chatNotice("Live now — waiting for chat messages...");
        lastChatStatus="live-empty";
      }else if(lastChatStatus!==signature){
        chatRoot.replaceChildren();
        for(const m of messages.slice(-8))addMessage(String(m.author||"Viewer"),String(m.text||""));
        lastChatStatus=signature;
      }
      delay=Math.max(15000,Number(data.pollingIntervalMillis)||15000);
    }else{
      const message=data.status==="offline"
        ?"Waiting for Squadding Quads to go live..."
        :data.status==="no_chat"
        ?"Stream detected — live chat unavailable."
        :"Checking for Squadding Quads livestream...";
      if(lastChatStatus!==data.status)chatNotice(message);
      lastChatStatus=data.status||"unknown";
    }
  }catch(error){
    console.warn("Chat refresh failed:",error);
    if(lastChatStatus!=="error")chatNotice("Live chat temporarily unavailable.");
    lastChatStatus="error";
  }finally{
    chatTimer=setTimeout(refreshChat,delay);
  }
}
if(params.get("demo")==="1"){
  [['Alex','Hello from the live chat!'],['Jordan','Looking good 👋'],['Sam','Great stream!']].forEach(x=>addMessage(...x));
  if(params.get("auto")!=="0")setInterval(simulateChat,3500);
}else{
  chatNotice("Checking for Squadding Quads livestream...");
  refreshChat();
}
</script></body></html>
